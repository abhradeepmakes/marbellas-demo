name: Rename uploaded file to index.html
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename marbella-s-demo-website.html to index.html
        run: |
          if [ -f marbella-s-demo-website.html ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git mv marbella-s-demo-website.html index.html
            git commit -m "Rename marbella-s-demo-website.html to index.html"
            git push origin HEAD:main
          else
            echo "Nothing to rename."
          fi
