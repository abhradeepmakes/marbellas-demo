name: Rename to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Rename uploaded file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm index.html
          git mv marbella-s-demo-website.html index.html
          git commit -m "Rename marbella-s-demo-website.html to index.html"
          git push
